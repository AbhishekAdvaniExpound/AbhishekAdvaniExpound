<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">GitHub activity and repository</title><desc id="desc">Recent public GitHub activity and a verified public repository.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0e1d31"/><stop offset="1" stop-color="#07111f"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#3b82f6"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs><style>
      text{font-family:Inter,Geist,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
      .mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',monospace}
      .title{fill:#f3f8ff;font-weight:650;letter-spacing:-.02em}
      .body{fill:#91a4bd}.label{fill:#22d3ee;font-weight:650;letter-spacing:.13em}
      .chip{fill:#f3f8ff;font-size:15px}.hair{stroke:#20344d;stroke-width:1}
      
      .reveal{opacity:0;transform:translateY(10px);animation:rise .65s cubic-bezier(.2,.75,.25,1) forwards}
      .pulse{animation:pulse 4s ease-in-out infinite}.dash{animation:dash 8s linear infinite}
      @keyframes rise{to{opacity:1;transform:translateY(0)}}
      @keyframes pulse{0%,100%{opacity:.35}50%{opacity:.85}}
      @keyframes dash{to{stroke-dashoffset:-80}}
    
      @media (prefers-reduced-motion:reduce){*{animation:none!important}.reveal{opacity:1!important;transform:none!important}}
    </style>
  <rect width="1200" height="320" rx="22" fill="url(#panel)"/>
  <rect x=".5" y=".5" width="1199" height="319" rx="21.5" fill="none" stroke="#20344d"/>
  
      <text x="50" y="53" class="title reveal" style="animation-delay:0.00s" font-size="28">GitHub activity</text><text x="1150" y="52" text-anchor="end" class="body mono" font-size="12">PUBLIC DATA · 1 REPOSITORY</text>
      <path d="M660 90V280" class="hair"/><text x="68" y="92" class="label mono" font-size="11">RECENT PUBLIC EVENTS</text><g class="reveal" style="animation-delay:0.09s"><circle cx="68" cy="130" r="5" fill="#22d3ee"/><text x="90" y="136" class="title" font-size="16">Push</text><text x="230" y="136" class="body mono" font-size="13">Harsh-Dubey14/zpp_bom_automation</text><text x="565" y="136" class="body mono" font-size="12">2026-10-23</text></g>
      <text x="720" y="92" class="label mono" font-size="11">VERIFIED PUBLIC REPOSITORY</text><g class="reveal" style="animation-delay:0.18s"><text x="720" y="142" class="title" font-size="22">AbhishekAdvaniExpound</text><text x="720" y="175" class="body" font-size="14">Source for this generated profile portfolio</text><text x="720" y="218" class="label mono" font-size="11">0 STARS · PROFILE README</text><path d="M720 246H1110" stroke="url(#accent)" stroke-width="2"/></g>
    
</svg>
