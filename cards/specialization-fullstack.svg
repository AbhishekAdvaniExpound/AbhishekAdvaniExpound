<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" role="img" aria-labelledby="title desc">
  <title id="title">Full-Stack Engineering</title><desc id="desc">Product-focused interfaces and dependable service layers. React.js, Node.js, Express, JavaScript, REST APIs</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0e1d31"/><stop offset="1" stop-color="#07111f"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#3b82f6"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs><style>
      text{font-family:Inter,Geist,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
      .mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',monospace}
      .title{fill:#f3f8ff;font-weight:650;letter-spacing:-.02em}
      .body{fill:#91a4bd}.label{fill:#22d3ee;font-weight:650;letter-spacing:.13em}
      .chip{fill:#f3f8ff;font-size:15px}.hair{stroke:#20344d;stroke-width:1}
      
      .reveal{opacity:0;transform:translateY(10px);animation:rise .65s cubic-bezier(.2,.75,.25,1) forwards}
      .pulse{animation:pulse 4s ease-in-out infinite}.dash{animation:dash 8s linear infinite}
      @keyframes rise{to{opacity:1;transform:translateY(0)}}
      @keyframes pulse{0%,100%{opacity:.35}50%{opacity:.85}}
      @keyframes dash{to{stroke-dashoffset:-80}}
    
      @media (prefers-reduced-motion:reduce){*{animation:none!important}.reveal{opacity:1!important;transform:none!important}}
    </style>
  <rect width="1200" height="200" rx="22" fill="url(#panel)"/>
  <rect x=".5" y=".5" width="1199" height="199" rx="21.5" fill="none" stroke="#20344d"/>
  
      <text x="48" y="58" class="label mono reveal" style="animation-delay:0.00s" font-size="14">SPECIALIZATION 02</text>
      <text x="48" y="107" class="title reveal" style="animation-delay:0.09s" font-size="32">Full-Stack Engineering</text>
      <text x="48" y="145" class="body reveal" style="animation-delay:0.18s" font-size="17">Product-focused interfaces and dependable service layers.</text>
      <path d="M478 42V158" class="hair"/><g class="reveal" style="animation-delay:0.27s"><g><rect x="525" y="78" width="104" height="34" rx="17" fill="#12243a" stroke="#20344d"/><text x="540" y="100" class="chip mono">React.js</text></g><g><rect x="641" y="78" width="104" height="34" rx="17" fill="#12243a" stroke="#20344d"/><text x="656" y="100" class="chip mono">Node.js</text></g><g><rect x="757" y="78" width="104" height="34" rx="17" fill="#12243a" stroke="#20344d"/><text x="772" y="100" class="chip mono">Express</text></g><g><rect x="873" y="78" width="122" height="34" rx="17" fill="#12243a" stroke="#20344d"/><text x="888" y="100" class="chip mono">JavaScript</text></g><g><rect x="1007" y="78" width="113" height="34" rx="17" fill="#12243a" stroke="#20344d"/><text x="1022" y="100" class="chip mono">REST APIs</text></g></g>
      <circle cx="1145" cy="44" r="8" fill="#22d3ee" opacity=".7" class="pulse"/>
    
</svg>
