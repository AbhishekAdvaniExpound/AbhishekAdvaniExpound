<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="365" viewBox="0 0 1200 365" role="img" aria-labelledby="title desc">
  <title id="title">Technology stack</title><desc id="desc">SAP application, full-stack and cloud delivery technologies.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0e1d31"/><stop offset="1" stop-color="#07111f"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#3b82f6"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs><style>
      text{font-family:Inter,Geist,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
      .mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',monospace}
      .title{fill:#f3f8ff;font-weight:650;letter-spacing:-.02em}
      .body{fill:#91a4bd}.label{fill:#22d3ee;font-weight:650;letter-spacing:.13em}
      .chip{fill:#f3f8ff;font-size:15px}.hair{stroke:#20344d;stroke-width:1}
      
      .reveal{opacity:0;transform:translateY(10px);animation:rise .65s cubic-bezier(.2,.75,.25,1) forwards}
      .pulse{animation:pulse 4s ease-in-out infinite}.dash{animation:dash 8s linear infinite}
      @keyframes rise{to{opacity:1;transform:translateY(0)}}
      @keyframes pulse{0%,100%{opacity:.35}50%{opacity:.85}}
      @keyframes dash{to{stroke-dashoffset:-80}}
    
      @media (prefers-reduced-motion:reduce){*{animation:none!important}.reveal,.cell{opacity:1!important;transform:none!important}.bar,.best{transform:none!important}}
    </style>
  <rect width="1200" height="365" rx="22" fill="url(#panel)"/>
  <rect x=".5" y=".5" width="1199" height="364" rx="21.5" fill="none" stroke="#20344d"/>
  <text x="55" y="55" class="title reveal" style="animation-delay:0.00s" font-size="28">Technology stack <tspan class="body" font-size="15" font-weight="400">/ grouped by delivery domain</tspan></text><g class="reveal" style="animation-delay:0.09s"><text x="55" y="112" class="label mono" font-size="13">SAP APPLICATION</text><text x="310" y="112" class="title" font-size="22">CAP · ABAP RAP · SAPUI5 · Fiori · OData V2/V4</text><path d="M55 139H1145" class="hair"/></g><g class="reveal" style="animation-delay:0.18s"><text x="55" y="194" class="label mono" font-size="13">FULL-STACK</text><text x="310" y="194" class="title" font-size="22">React.js · Node.js · Express · JavaScript · REST APIs</text><path d="M55 221H1145" class="hair"/></g><g class="reveal" style="animation-delay:0.27s"><text x="55" y="276" class="label mono" font-size="13">CLOUD DELIVERY</text><text x="310" y="276" class="title" font-size="22">SAP BTP · Cloud Foundry · Integrations · CI/CD · Multi-tenant SaaS</text><path d="M55 303H1145" class="hair"/></g>
</svg>
